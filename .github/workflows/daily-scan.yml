name: 箱波均戰法每日選股

on:
  schedule:
    - cron: "0 7 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily scan
        run: python stock_screener/auto_run.py

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_screener/output

          if git diff --cached --quiet; then
            echo "無異動，略過 commit"
            exit 0
          fi

          git commit -m "chore: 更新箱波均戰法選股報表"

          success=false
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "推送成功（第 $i 次嘗試）"
              success=true
              break
            fi
            echo "推送失敗，5 秒後重試（第 $i 次）..."
            sleep 5
          done

          if [ "$success" = false ]; then
            echo "重試 5 次仍失敗，可能有其他來源持續在推送到 main"
            exit 1
          fi
